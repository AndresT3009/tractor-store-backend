services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tractor_store
      POSTGRES_USER: tractor_store
      POSTGRES_PASSWORD: tractor_store
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tractor_store -d tractor_store"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
