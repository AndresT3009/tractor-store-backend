services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tractor_store
      POSTGRES_USER: tractor_store
      POSTGRES_PASSWORD: tractor_store
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tractor_store -d tractor_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  # profiles: ["full"] hace que ni Boot's docker-compose auto-management ni un "docker compose up" a
  # secas levanten este servicio; solo "docker compose --profile full up" lo incluye, evitando dos
  # instancias del backend peleando por el puerto 8080 cuando se corre con "./mvnw spring-boot:run".
  # Sin Keycloak: el carrito usa sesión anónima, no un usuario autenticado.
  backend:
    build: .
    profiles: ["full"]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/tractor_store
      DATABASE_USERNAME: tractor_store
      DATABASE_PASSWORD: tractor_store
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana-data:
