services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tractor_store
      POSTGRES_USER: tractor_store
      POSTGRES_PASSWORD: tractor_store
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tractor_store -d tractor_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fase B11: el backend NO corre en este compose (se levanta con ./mvnw spring-boot:run en el
  # host), por eso Prometheus scrapea host.docker.internal en vez de un nombre de servicio.
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana-data:
