spring:
  application:
    name: tractor-store-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/tractor_store}
    username: ${DATABASE_USERNAME:tractor_store}
    password: ${DATABASE_PASSWORD:tractor_store}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

tractor-store:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
