server:
  port: ${PORT:8080}

spring:
  application:
    name: tractor-store-backend
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/tractor_store}
    username: ${DATABASE_USERNAME:tractor_store}
    password: ${DATABASE_PASSWORD:tractor_store}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

tractor-store:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
